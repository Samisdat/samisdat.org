name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @samisdat/storybook exec playwright install chromium --with-deps

      - name: Lint CSS
        run: pnpm lint:css

      - name: Lint hardcoded colors
        run: pnpm lint:colors

      - name: Lint color tokens
        run: pnpm lint:tokens

      - name: Build panorama library
        run: pnpm --filter @samisdat/wtal-panorama build:colors && pnpm build:lib

      - name: Lint and typecheck
        run: pnpm lint

      - name: Check version consistency
        run: pnpm syncpack lint

      - name: Run tests
        run: |
          pnpm --filter @samisdat/codeprose test:ci
          pnpm --filter @samisdat/wtal-panorama test:ci
          pnpm --filter @samisdat/website test:ci
          pnpm --filter @samisdat/storybook test:ci

      - name: Publish codeprose coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/codeprose/coverage/lcov.info
          add-prefix: packages/codeprose/
          name: codeprose
          total-parts-count: 4

      - name: Publish panorama coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/panorama/coverage/lcov.info
          add-prefix: packages/panorama/
          name: panorama
          total-parts-count: 4

      - name: Publish website coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/website/coverage/lcov.info
          add-prefix: packages/website/
          name: website
          total-parts-count: 4

      - name: Make storybook coverage paths repo-relative
        run: sed -i 's#^SF:\.\./#SF:packages/#' packages/storybook/coverage/lcov.info

      - name: Publish storybook coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/storybook/coverage/lcov.info
          name: storybook
          total-parts-count: 4

      - name: Build website
        run: pnpm --filter @samisdat/website build

      - name: Build Storybook
        run: pnpm build-storybook
