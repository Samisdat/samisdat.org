name: Chromatic Deployment

# Deploy Storybook to Chromatic on pushes to main and on PRs, but only when
# something the stories render has changed. The free plan has a monthly
# snapshot budget, so every run has to earn its snapshots.
on:
  push:
    branches:
      - main
    paths: &visual-paths
      - 'packages/ui-components/**'
      - 'packages/storybook/**'
      - 'packages/color-scheme/**'
      - 'packages/panorama/**'
      - 'packages/tools/**'
      - '.github/workflows/chromatic.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *visual-paths

# A newer push to the same PR supersedes the running build. Builds on main are
# never cancelled so the baseline always advances.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    # Dependabot-Läufe bekommen keine Actions-Secrets (CHROMATIC_PROJECT_TOKEN
    # fehlt) — und visuelle Regression auf Dependency-Bumps braucht es nicht.
    # Draft-PRs werden erst bei ready_for_review gebaut.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Chromatic needs full git history for baselines

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @samisdat/storybook exec playwright install chromium --with-deps

      - name: Build panorama library
        run: pnpm --filter @samisdat/wtal-panorama build:colors && pnpm build:lib

      - name: Publish to Chromatic
        uses: chromaui/action@f305ef908327aee3b80b0e6b3bbb60a742eaa049 # v18.13.6
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/storybook
          buildScriptName: build-storybook
          # TurboSnap: only snapshot stories affected by the change (needs the
          # full git history from the checkout above)
          onlyChanged: true
          # Auto-accept changes on main so every merge advances the baseline
          autoAcceptChanges: main
