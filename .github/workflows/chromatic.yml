name: Chromatic Deployment

# Deploy Storybook to Chromatic on every push to main and every PR
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  chromatic:
    # Dependabot-Läufe bekommen keine Actions-Secrets (CHROMATIC_PROJECT_TOKEN
    # fehlt) — und visuelle Regression auf Dependency-Bumps braucht es nicht.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Chromatic needs full git history for baselines

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @samisdat/storybook exec playwright install chromium --with-deps

      - name: Build panorama library
        run: pnpm --filter @samisdat/wtal-panorama build:colors && pnpm build:lib

      - name: Publish to Chromatic
        uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/storybook
          buildScriptName: build-storybook
          # Auto-accept changes on main so every merge advances the baseline
          autoAcceptChanges: main
