packages:
  - 'packages/*'

catalog:
  # React ecosystem - shared across all packages
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  
  # Next.js
  next: ^16.3.8
  
  # TypeScript
  typescript: ^5.9.3
  
  # Linaria/wyw-in-js
  '@linaria/core': ^8.2.0
  '@linaria/react': ^8.2.0
  '@wyw-in-js/nextjs': ^2.5.2
  '@wyw-in-js/vite': ^2.5.1
  
  # Prettier
  prettier: ^3.9.9
  prettier-plugin-multiline-arrays: ^4.1.11
  prettier-plugin-organize-imports: ^4.3.0
  
  # FontAwesome
  '@fortawesome/fontawesome-svg-core': ^7.3.1
  '@fortawesome/free-brands-svg-icons': ^7.3.1
  '@fortawesome/free-regular-svg-icons': ^7.3.1
  '@fortawesome/free-solid-svg-icons': ^7.3.1
  '@fortawesome/react-fontawesome': ^3.5.0
  
  # Shiki
  shiki: ^4.5.0
  
  # Shared utils
  normalize.css: ^8.0.1
  fs-extra: ^11.4.1
  '@types/node': ^26
  
  # Testing
  vitest: ^4.1.11
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  playwright: ^1.63.0

allowBuilds:
  es5-ext: true
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
