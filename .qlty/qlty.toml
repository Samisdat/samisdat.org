config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # deliberate stand-alone copies of the demos, their duplication is expected
  "packages/website/codesandboxes/**",
  # exported SVG path data: same structure, different values
  "packages/panorama/src/components/Buildings/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

# Prettier versions mirror pnpm-workspace.yaml (catalog).
# qlty installs with npm, which cannot resolve "catalog:".
[[plugin]]
name = "prettier"
version = "3.9.10"
extra_packages = ["prettier-plugin-organize-imports@4.3.0", "prettier-plugin-multiline-arrays@4.1.11"]
prefix = "packages/panorama"

[[plugin]]
name = "prettier"
version = "3.9.10"
extra_packages = ["prettier-plugin-organize-imports@4.3.0", "prettier-plugin-multiline-arrays@4.1.11"]
prefix = "packages/website"

[[plugin]]
name = "prettier"
version = "3.9.10"
extra_packages = ["prettier-plugin-organize-imports@4.3.0", "prettier-plugin-multiline-arrays@4.1.11"]
prefix = "packages/ui-components"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "stylelint"
package_file = "package.json"
# postcss-styled-syntax is the customSyntax in .stylelintrc.json; its name does not contain "stylelint"
package_filters = ["stylelint", "postcss-styled-syntax"]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
